name: Validate skill package

# Pushes to main are validated by the website deploy workflow; stats holds only data.
on:
  pull_request:
  push:
    branches-ignore: [main, stats]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
